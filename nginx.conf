server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        
        # Tries to serve the requested path as a file, then directory, 
        # and falls back to index.html if neither exists.
        try_files $uri $uri/ /index.html;
    }

    # Error pages configuration (optional)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # PROXY ALL /api REQUESTS TO PHP BACKEND
    location /api/react-commerce/ {
        proxy_pass http://php-backend-service:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}